<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>巧克力九重奏 · Chocolate Nonet Cake</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --d:#3E2723;--c:#5D4037;--m:#8D6E63;--ca:#D7A86E;
    --cr:#FFF8E1;--wc:#F5E6D3;--w:#FDF6EC;--gold:#C66900;
  }
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#2B1B14;color:var(--d);display:flex;flex-direction:column;overflow:hidden}
  #topbar{background:var(--c);padding:8px 14px 10px;flex-shrink:0;color:var(--cr);border-bottom:3px solid var(--ca)}
  #strack{display:flex;align-items:center;gap:3px;margin-bottom:6px}
  .tdot{flex:1;height:5px;border-radius:3px;background:rgba(255,248,225,.2);transition:background .3s}
  .tdot.done{background:var(--ca)}
  .tdot.cur{background:#FFD54F;box-shadow:0 0 10px rgba(255,213,79,.8)}
  #sname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #sname .num{font-size:clamp(12px,1.5vw,15px);color:#3E2723;font-weight:800;letter-spacing:.5px;background:var(--ca);padding:4px 12px;border-radius:11px;white-space:nowrap}
  #sname .en{font-size:clamp(15px,2vw,21px);color:var(--ca);font-weight:700;font-style:italic}
  #sname .zh{font-size:clamp(15px,1.9vw,20px);font-weight:700;letter-spacing:.5px}
  #sname .stage{font-size:clamp(11px,1.3vw,13px);background:rgba(255,248,225,.14);color:var(--cr);padding:3px 10px;border-radius:11px;font-weight:700;margin-left:auto;white-space:nowrap}
  #ingbar{flex-shrink:0;background:var(--wc);border-bottom:3px solid var(--ca);padding:7px 10px;display:flex;align-items:center;gap:10px;transition:max-height .35s ease,padding .35s ease,opacity .25s ease;max-height:80px;overflow:hidden}
  .ib-label{font-size:13px;font-weight:800;color:var(--m);letter-spacing:1px;white-space:nowrap;flex-shrink:0;padding-left:2px}
  #ring{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;flex:1;min-width:0;scrollbar-width:thin}
  #ring::-webkit-scrollbar{height:5px}
  #ring::-webkit-scrollbar-thumb{background:#D7CCC8;border-radius:3px}
  .ing-empty{font-size:13px;color:#BCAAA4;font-style:italic;padding:8px 4px;white-space:nowrap}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #E8D5B7;border-radius:11px;padding:4px 10px;transition:all .35s;position:relative}
  .chip.hl{border-color:#FFB74D;background:#FFF8E1;box-shadow:0 0 0 2px rgba(255,183,77,.25)}
  .chip.gone{opacity:.32;filter:grayscale(.7)}
  .chip svg{width:24px;height:24px;flex-shrink:0}
  .chip .czh{font-size:14px;font-weight:700;color:var(--d);white-space:nowrap}
  .chip .camt{font-size:15px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
  body.title-mode #ingbar{max-height:0;padding-top:0;padding-bottom:0;border-bottom-width:0;opacity:0}
  body.title-mode #recipe{display:none}
  body.title-mode #co-area{display:none}
  #main{flex:1;display:flex;min-height:0;position:relative;background:var(--w)}
  #recipe{width:clamp(220px,24vw,320px);flex-shrink:0;background:var(--w);border-right:3px solid var(--ca);display:flex;flex-direction:column;overflow-y:auto}
  .rp-head{font-size:clamp(14px,1.5vw,17px);letter-spacing:1.2px;color:var(--m);font-weight:800;padding:14px 14px 4px}
  .rp-head span{color:var(--ca)}
  #rstep{padding:2px 14px 14px;border-bottom:2px dashed #E8D5B7}
  #rstep .r-en{font-size:clamp(17px,2.05vw,24px);color:var(--d);font-weight:800;line-height:1.45}
  #rstep .r-zh{font-size:clamp(15px,1.65vw,19px);color:#5D4037;margin-top:8px;line-height:1.65;font-weight:600}
  #ruse{padding:6px 14px 20px;display:flex;flex-direction:column;gap:5px}
  .urow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1.5px solid #E8D5B7;border-radius:9px;padding:6px 10px}
  .urow .un{font-size:15px;font-weight:700;color:var(--d)}
  .urow .ua{font-size:15px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .use-empty{font-size:14px;color:#BCAAA4;font-style:italic;padding:4px 2px}
  #stageWrap{flex:1;min-width:0;display:flex;flex-direction:row;background:var(--w);overflow:hidden}
  #stage{flex:1;min-width:0;position:relative;overflow:hidden;background:linear-gradient(to bottom,#FDF6EC 0%,#FDF6EC 68%,#E8D5B7 68%,#E8D5B7 100%)}
  #scene{position:absolute;inset:0}
  #scene svg{width:100%;height:100%;display:block}
  #co-area{width:clamp(200px,26%,320px);flex-shrink:0;background:#FBF3E6;border-left:2px dashed #E8D5B7;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:10px 9px 78px;scrollbar-width:thin}
  #co-area::-webkit-scrollbar{width:5px}
  #co-area::-webkit-scrollbar-thumb{background:#D7CCC8;border-radius:3px}
  .co{padding:12px 15px;background:rgba(255,255,255,.98);border-radius:12px;border-left:4px solid var(--ca);box-shadow:0 4px 14px rgba(62,39,35,.12);opacity:0;transform:translateX(16px);transition:opacity .4s cubic-bezier(.22,1,.36,1),transform .4s cubic-bezier(.22,1,.36,1)}
  .co.in{opacity:1;transform:translateX(0)}
  .co .en{font-size:clamp(14px,1.55vw,18px);color:var(--d);font-weight:700;line-height:1.45}
  .co .zh{font-size:clamp(13px,1.4vw,16px);color:#8D6E63;margin-top:4px;line-height:1.55;font-weight:600}
  .co .en .vb{color:var(--gold);font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
  .co .icon{font-size:18px;margin-right:5px}
  #nav{position:fixed;right:16px;bottom:14px;display:flex;gap:9px;z-index:960}
  .nb{font-family:inherit;font-size:clamp(13px,1.3vw,15px);font-weight:700;padding:11px 22px;border-radius:24px;border:none;cursor:pointer;background:var(--c);color:var(--cr);box-shadow:0 6px 18px rgba(62,39,35,.3);transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s,opacity .2s}
  .nb:hover:not(:disabled){background:var(--d);transform:translateY(-2px)}
  .nb:disabled{opacity:.3;cursor:not-allowed}
  .nb.pri{background:var(--ca);color:#3E2723}
  .nb.pri:hover:not(:disabled){background:#E8BE84}
  .ap{opacity:0;transform:translateY(12px);transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}
  .ap.in{opacity:1;transform:translateY(0)}
  .aps{opacity:0;transform:scale(.4);transition:opacity .5s cubic-bezier(.34,1.56,.64,1),transform .5s cubic-bezier(.34,1.56,.64,1)}
  .aps.in{opacity:1;transform:scale(1)}
  .steam{animation:steam 2.6s ease-out infinite;transform-origin:center bottom}
  @keyframes steam{0%{opacity:0;transform:translateY(6px) scale(.8)}35%{opacity:.6}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}
  .whisk-circle{animation:wcircle .8s linear infinite}
  @keyframes wcircle{0%{transform:translate(0,-15px)}12.5%{transform:translate(11px,-11px)}25%{transform:translate(15px,0)}37.5%{transform:translate(11px,11px)}50%{transform:translate(0,15px)}62.5%{transform:translate(-11px,11px)}75%{transform:translate(-15px,0)}87.5%{transform:translate(-11px,-11px)}100%{transform:translate(0,-15px)}}
  .whisk-stir{animation:whiskStir .8s linear infinite}
  @keyframes whiskStir{
    0%{transform:translate(0,-12px)}
    25%{transform:translate(12px,0)}
    50%{transform:translate(0,12px)}
    75%{transform:translate(-12px,0)}
    100%{transform:translate(0,-12px)}
  }
  .stir-small{animation:stirsm .7s linear infinite}
  @keyframes stirsm{0%{transform:translate(0,-7px)}25%{transform:translate(7px,0)}50%{transform:translate(0,7px)}75%{transform:translate(-7px,0)}100%{transform:translate(0,-7px)}}
  .title-pop{opacity:0;transform:scale(.7);transition:opacity .7s cubic-bezier(.34,1.56,.64,1),transform .7s cubic-bezier(.34,1.56,.64,1)}
  .title-pop.in{opacity:1;transform:scale(1)}
  @media (max-width: 1100px){
    #recipe{width:clamp(190px,22vw,260px)}
    #co-area{width:clamp(180px,26%,270px)}
  }
  @media (max-width: 900px){
    body{overflow:hidden}
    #topbar{padding:7px 12px 8px}
    #sname .stage{display:none}
    #ingbar{padding:6px 8px;max-height:74px}
    .ib-label{display:none}
    #main{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #recipe{width:100%;border-right:none;border-bottom:3px solid var(--ca);overflow:visible;flex-shrink:0}
    #stageWrap{flex-direction:column;flex:none;width:100%;overflow:visible}
    #stage{flex:none;width:100%;aspect-ratio:16/10;min-height:180px}
    #co-area{width:100%;border-left:none;border-top:2px dashed #E8D5B7;padding:10px;max-height:none;overflow:visible;flex-direction:row;flex-wrap:wrap;gap:7px}
    .co{flex:1 1 auto;min-width:160px}
    #nav{right:10px;bottom:10px}
    .nb{padding:9px 16px;font-size:13px;border-radius:20px}
    /* ==================== 照片展示 ==================== */
    .photo-group{
      transform-box:fill-box;
      transform-origin:center;
      opacity:0;
      transform:scale(0.4);
      transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.34,1.56,.64,1);
    }
    .photo-group.in{
      opacity:1;
      transform:scale(1);
    }
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="strack"></div>
  <div id="sname">
    <span class="num">STEP 1 / 1</span>
    <span class="en">—</span>
    <span class="zh">—</span>
    <span class="stage">—</span>
  </div>
</div>

<div id="ingbar">
  <span class="ib-label">原料 · ING</span>
  <div id="ring"></div>
</div>

<div id="main">
  <aside id="recipe">
    <div class="rp-head">配方 <span>· RECIPE</span></div>
    <div id="rstep"></div>
    <div class="rp-head">本步用料 <span>· USING NOW</span></div>
    <div id="ruse"></div>
  </aside>
  <section id="stageWrap">
    <div id="stage"><div id="scene"></div></div>
    <aside id="co-area"></aside>
  </section>
</div>

<div id="nav">
  <button class="nb" id="prevBtn">← 上一步</button>
  <button class="nb pri" id="nextBtn">下一步 →</button>
</div>

<script>
/* ==================== 工具函数 ==================== */
const sceneEl = document.getElementById('scene');
const coAreaEl = document.getElementById('co-area');
const ringEl = document.getElementById('ring');
let timers = [];
let introOffset = 0;
const rawLater = (fn, ms) => timers.push(setTimeout(fn, ms || 0));
const later = (fn, ms) => timers.push(setTimeout(fn, (ms || 0) + introOffset));
const clearT = () => { timers.forEach(clearTimeout); timers = []; };

const VERB_SET = new Set(['whisk','beat','whip','fold','sift','melt','stir','add','pour','chill','mix','spread','heat','strain','cool','bake','preheat','invert','unmold','press','combine','cover','soak','drain','decorate','crack','blend','set','smooth','slice','serve','assemble','stack','tap','sprinkle','shake','cook','boil','finish','deflate','return','separate','warm','coat','flip','scrape']);

function highlightEn(text){
  return text.replace(/[A-Za-z][A-Za-z']*/g, w => {
    let base = w.toLowerCase().replace(/'s$/, '');
    let hit = VERB_SET.has(base);
    if(!hit){
      const sfx = ['ping','ring','ped','red','ing','ed','en','es','s','d'];
      for(const sf of sfx){ if(base.length > sf.length + 2 && base.endsWith(sf)){ const b = base.slice(0, -sf.length); if(VERB_SET.has(b) || (b.length > 1 && VERB_SET.has(b.slice(0, -1)))){ hit = true; break; } } }
    }
    return hit ? `<b class="vb">${w}</b>` : w;
  });
}

function showCO(en, zh, delay, icon){
  later(() => {
    const el = document.createElement('div');
    el.className = 'co';
    el.innerHTML = `<div class="en">${icon?'<span class="icon">'+icon+'</span>':''}${highlightEn(en)}</div><div class="zh">${zh}</div>`;
    coAreaEl.appendChild(el);
    void el.offsetWidth;
    el.classList.add('in');
    coAreaEl.scrollTop = coAreaEl.scrollHeight;
  }, delay || 0);
}
function reveal(sel, cls, delay){ later(()=>sceneEl.querySelectorAll(sel).forEach(el=>el.classList.add(cls||'in')), delay||0); }
function show(sel, delay, dur){ later(()=>sceneEl.querySelectorAll(sel).forEach(el=>{ el.style.transition=`opacity ${dur||.5}s ease`; el.style.opacity='1'; }), delay||0); }
function setStyle(sel, styles, delay){ later(()=>sceneEl.querySelectorAll(sel).forEach(el=>{ for(const k in styles) el.style[k]=styles[k]; }), delay||0); }

/* ==================== 原料图标 ==================== */
const ICONS = {
  dark_choc:`<rect x="4" y="5" width="16" height="14" rx="2" fill="#4E342E"/><line x1="12" y1="5" x2="12" y2="19" stroke="#2B1B14" stroke-width="1"/><line x1="4" y1="12" x2="20" y2="12" stroke="#2B1B14" stroke-width="1"/>`,
  white_choc:`<rect x="4" y="5" width="16" height="14" rx="2" fill="#F5E6D3"/><line x1="12" y1="5" x2="12" y2="19" stroke="#C9A876" stroke-width="1"/><line x1="4" y1="12" x2="20" y2="12" stroke="#C9A876" stroke-width="1"/>`,
  butter:`<rect x="4" y="7" width="16" height="12" rx="2" fill="#FFE082" stroke="#E0B784" stroke-width="1"/>`,
  sugar:`<path d="M5 18 L12 5 L19 18 Z" fill="#EFEBE9" stroke="#D7CCC8" stroke-width="1"/><circle cx="10" cy="14" r="1" fill="#BCAAA4"/><circle cx="14" cy="15" r="1" fill="#BCAAA4"/>`,
  egg:`<ellipse cx="12" cy="13" rx="6.5" ry="8.5" fill="#FFE0B2" stroke="#E0B784" stroke-width="1"/>`,
  flour:`<path d="M5 20 L5 8 Q5 6 7 6 L17 6 Q19 6 19 8 L19 20 Z" fill="#FFF3E0" stroke="#D7CCC8" stroke-width="1"/><rect x="4" y="4" width="16" height="3" rx="1.5" fill="#D7CCC8"/>`,
  cocoa:`<rect x="5" y="5" width="14" height="15" rx="2" fill="#5D4037"/><rect x="7" y="3" width="10" height="3" rx="1" fill="#8D6E63"/>`,
  salt:`<path d="M7 20 L7 10 Q7 8 9 8 L15 8 Q17 8 17 10 L17 20 Z" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1"/><circle cx="10" cy="13" r=".8" fill="#90A4AE"/><circle cx="14" cy="15" r=".8" fill="#90A4AE"/>`,
  milk:`<path d="M6 20 L6 9 L8 6 L16 6 L18 9 L18 20 Z" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1"/><rect x="10" y="4" width="4" height="2" fill="#CFD8DC"/>`,
  oil:`<rect x="6" y="6" width="12" height="14" rx="2" fill="#FFF59D" stroke="#E6C34A" stroke-width="1"/><rect x="9" y="3" width="6" height="3" rx="1" fill="#E6C34A"/>`,
  lemon:`<circle cx="12" cy="13" r="7" fill="#FFF59D" stroke="#E6C34A" stroke-width="1"/><line x1="12" y1="6" x2="12" y2="20" stroke="#E6C34A" stroke-width=".7"/><line x1="5" y1="13" x2="19" y2="13" stroke="#E6C34A" stroke-width=".7"/>`,
  cream:`<path d="M6 20 L6 9 L9 5 L15 5 L18 9 L18 20 Z" fill="#FFFDE7" stroke="#E0E0E0" stroke-width="1"/><path d="M6 11 Q12 13 18 11" fill="none" stroke="#E0E0E0" stroke-width=".8"/>`,
  gelatin:`<rect x="4" y="10" width="16" height="8" rx="2" fill="#E1F5FE" stroke="#B3E5FC" stroke-width="1"/>`,
  psugar:`<path d="M5 18 L12 5 L19 18 Z" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1"/>`,
  cocoab:`<circle cx="12" cy="13" r="7" fill="#FFF3E0" stroke="#D7A86E" stroke-width="1"/>`,
  crunch:`<rect x="4" y="8" width="7" height="6" rx="1" fill="#D7A86E"/><rect x="13" y="11" width="7" height="6" rx="1" fill="#D7A86E"/><rect x="8" y="15" width="6" height="5" rx="1" fill="#C9A876"/>`,
  boba:`<circle cx="8" cy="12" r="4" fill="#3E2723"/><circle cx="16" cy="15" r="3.5" fill="#3E2723"/><circle cx="14" cy="8" r="3" fill="#3E2723"/>`,
  mold:`<rect x="4" y="7" width="16" height="12" rx="2" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1"/><rect x="6" y="9" width="12" height="8" rx="1" fill="#ECEFF1"/>`,
  whisk:`<rect x="11" y="2" width="2.2" height="9" rx="1" fill="#90A4AE"/><ellipse cx="12" cy="15" rx="4.5" ry="6.5" fill="none" stroke="#B0BEC5" stroke-width="1.6"/><ellipse cx="12" cy="15" rx="1.8" ry="6.5" fill="none" stroke="#B0BEC5" stroke-width="1.1"/><ellipse cx="12" cy="15" rx="6.8" ry="6.5" fill="none" stroke="#CFD8DC" stroke-width="1"/>`,
  pan:`<path d="M3 9 L3 17 L17 17 L17 9 Q10 6 3 9 Z" fill="#90A4AE"/><path d="M5 11 L15 11 L15 15 L5 15 Z" fill="#ECEFF1"/><rect x="17" y="11" width="6" height="2.4" rx="1.2" fill="#78909C"/>`
};

/* ==================== 原料数据 ==================== */
const ING = {
  dark_choc:{zh:'黑巧克力',en:'Dark chocolate',unit:'g',total:185,icon:'dark_choc'},
  white_choc:{zh:'白巧克力',en:'White chocolate',unit:'g',total:100,icon:'white_choc'},
  butter:{zh:'无盐黄油',en:'Unsalted butter',unit:'g',total:40,icon:'butter'},
  sugar:{zh:'细砂糖',en:'Caster sugar',unit:'g',total:130,icon:'sugar'},
  egg:{zh:'鸡蛋',en:'Eggs',unit:'个',total:4,icon:'egg'},
  flour:{zh:'低筋面粉',en:'Cake flour',unit:'g',total:75,icon:'flour'},
  cocoa:{zh:'可可粉',en:'Cocoa powder',unit:'g',total:20,icon:'cocoa'},
  salt:{zh:'盐',en:'Salt',unit:'g',total:0.5,icon:'salt'},
  milk:{zh:'牛奶',en:'Milk',unit:'g',total:295,icon:'milk'},
  oil:{zh:'玉米油',en:'Corn oil',unit:'g',total:30,icon:'oil'},
  lemon:{zh:'柠檬汁',en:'Lemon juice',unit:'滴',total:5,icon:'lemon'},
  cream:{zh:'淡奶油',en:'Heavy cream',unit:'g',total:560,icon:'cream'},
  gelatin:{zh:'吉利丁片',en:'Gelatin sheets',unit:'g',total:13,icon:'gelatin'},
  psugar:{zh:'糖粉',en:'Powdered sugar',unit:'g',total:15,icon:'psugar'},
  cocoab:{zh:'可可脂',en:'Cocoa butter',unit:'g',total:5,icon:'cocoab'},
  crunch:{zh:'黄油薄脆',en:'Butter crunch',unit:'g',total:40,icon:'crunch'},
  boba:{zh:'巧克力爆珠',en:'Popping boba',unit:'g',total:20,icon:'boba'},
  mold:{zh:'6寸加高圆模',en:'6-inch mold',unit:'',total:1,icon:'mold'},
  whisk_t:{zh:'打蛋器',en:'Whisk',unit:'',total:1,icon:'whisk'},
  pan_t:{zh:'奶锅',en:'Saucepan',unit:'',total:1,icon:'pan'}
};

const state = {};
for (const k in ING) state[k] = ING[k].total;
let ingReady = false;

function fmtNum(v){ if (v <= 0) return '0'; return v % 1 === 0 ? String(v) : v.toFixed(1); }

function renderRecipe(highlight){
  if(!ingReady){ ringEl.innerHTML = `<div class="ing-empty">原料稍后在这里显示…</div>`; return; }
  const sl = ringEl.scrollLeft;
  let html = '';
  Object.keys(ING).forEach(k=>{
    const d = ING[k];
    const left = state[k];
    const gone = (left <= 0 && d.unit) ? ' gone' : '';
    const hl = (highlight && highlight.includes(k)) ? ' hl' : '';
    const amtText = d.unit ? `${fmtNum(left)}${d.unit}` : (left > 0 ? '✓' : '✓');
    html += `<div class="chip${gone}${hl}" data-k="${k}"><svg viewBox="0 0 24 24">${ICONS[d.icon]}</svg><span class="czh">${d.zh}</span><span class="camt">${amtText}</span></div>`;
  });
  ringEl.innerHTML = html;
  ringEl.scrollLeft = sl;
}

function useIng(map){ if(!map) return; for(const k in map) state[k] = Math.max(0, state[k] - map[k]); }

function renderUseList(uses){
  const el = document.getElementById('ruse');
  const keys = Object.keys(uses || {});
  if(!keys.length){ el.innerHTML = '<div class="use-empty">— 本步无原料消耗 —</div>'; return; }
  el.innerHTML = keys.map(k=>{ const d = ING[k]; const amt = uses[k] > 0 ? `${fmtNum(uses[k])}${d.unit}` : '工具'; return `<div class="urow"><span class="un">${d.zh}</span><span class="ua">${amt}</span></div>`; }).join('');
}

/* ==================== 中文→英文标签映射 ==================== */
const ZH_EN = {
  '黄油': 'Butter',
  '黑巧克力': 'Dark chocolate',
  '细砂糖': 'Caster sugar',
  '鸡蛋': 'Egg',
  '低筋面粉': 'Cake flour',
  '可可粉': 'Cocoa powder',
  '盐': 'Salt',
  '打蛋器': 'Whisk',
  '6寸加高圆模': '6" mold',
  '牛奶': 'Milk',
  '玉米油': 'Corn oil',

/* ==================== 场景元素飞入 ==================== */
function svgScaleOf(svg){
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const w = vb && vb.width ? vb.width : 900;
  const h = vb && vb.height ? vb.height : 500;
  return Math.min(rect.width / w, rect.height / h) || 1;
}

function runFlyIns(){
  const svg = sceneEl.querySelector('svg');
  if(!svg) return;
  const scale = svgScaleOf(svg);
  const stage = document.getElementById('stage');
  if(stage.getBoundingClientRect().width < 10) return;

  const items = Array.from(sceneEl.querySelectorAll('[data-fly]'));
  items.forEach((el, idx) => {
    const key = el.getAttribute('data-fly');
    const chip = ringEl.querySelector(`.chip[data-k="${key}"]`);
    if(!chip) return;
    el.style.transform = '';
    void el.getBoundingClientRect();
    const finalR = el.getBoundingClientRect();
    const chipR = chip.getBoundingClientRect();
    if(finalR.width === 0 || chipR.width === 0) return;
    const dxS = (chipR.left + chipR.width/2) - (finalR.left + finalR.width/2);
    const dyS = (chipR.top + chipR.height/2) - (finalR.top + finalR.height/2);
    const dx = dxS / scale;
    const dy = dyS / scale;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px) scale(0.42)`;
    void el.getBoundingClientRect();
    rawLater(() => {
      el.style.transition = 'transform .65s cubic-bezier(.5,-0.05,.4,1), opacity .3s ease';
      el.style.transform = 'translate(0px, 0px) scale(1)';
      el.style.opacity = '1';
    }, 30 + idx * 130);
    chip.style.transition = 'transform .28s ease';
    chip.style.transform = 'translateY(-5px)';
    setTimeout(() => { chip.style.transform = ''; }, 300);
  });
}

function bowl(cx, cy, rx, fill, fillOp){
  const ry = rx * 0.23;
  return `<path d="M${cx-rx} ${cy} A ${rx} ${rx} 0 0 0 ${cx+rx} ${cy} Z" fill="#B0BEC5"/><path d="M${cx-rx} ${cy} A ${rx} ${rx} 0 0 0 ${cx+rx} ${cy} Z" fill="url(#bowlG)"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#CFD8DC"/><ellipse class="bowl-fill" cx="${cx}" cy="${cy}" rx="${rx-7}" ry="${ry-3}" fill="${fill||'#E0E0E0'}" opacity="${fillOp==null?1:fillOp}"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#90A4AE" stroke-width="2"/>`;
}

function glassBowl(cx, cy, rx, fill, fillOp){
  const ry = rx * 0.23;
  return `<path d="M${cx-rx} ${cy} A ${rx} ${rx} 0 0 0 ${cx+rx} ${cy} Z" fill="rgba(207,216,220,.45)" stroke="#90A4AE" stroke-width="2.5"/><ellipse class="bowl-fill" cx="${cx}" cy="${cy}" rx="${rx-7}" ry="${ry-3}" fill="${fill||'#E0E0E0'}" opacity="${fillOp==null?1:fillOp}"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#90A4AE" stroke-width="2.5"/>`;
}

function saucepan(cx, cy, w, contentColor){

  return `<g><rect x="${cx+w/2-4}" y="${cy-h}" width="9" height="34" rx="4" fill="#78909C" transform="rotate(28 ${cx+w/2} ${cy-h})"/><path d="M${cx-w/2} ${cy-h} L${cx-w/2+6} ${cy} L${cx+w/2-6} ${cy} L${cx+w/2} ${cy-h} Z" fill="#90A4AE"/><path class="pan-fill" d="M${cx-w/2+6} ${cy-h+8} L${cx-w/2+10} ${cy-4} L${cx+w/2-10} ${cy-4} L${cx+w/2-6} ${cy-h+8} Z" fill="${contentColor||'#5D4037'}"/><ellipse cx="${cx}" cy="${cy-h}" rx="${w/2}" ry="${w*0.13}" fill="#B0BEC5"/><ellipse class="pan-top" cx="${cx}" cy="${cy-h}" rx="${w/2-6}" ry="${w*0.1}" fill="${contentColor||'#5D4037'}"/></g>`;
}

function whiskG(cx, cy, len, angle){
  const wc = cy - len * 0.3;
  return `<g class="wg" transform="rotate(${angle||0} ${cx} ${cy})"><rect x="${cx-5}" y="${cy-len}" width="10" height="${len*0.58}" rx="5" fill="#90A4AE"/><ellipse cx="${cx}" cy="${wc}" rx="15" ry="${len*0.44}" fill="none" stroke="#B0BEC5" stroke-width="3.5"/><ellipse cx="${cx}" cy="${wc}" rx="6" ry="${len*0.44}" fill="none" stroke="#B0BEC5" stroke-width="2.5"/><ellipse cx="${cx}" cy="${wc}" rx="23" ry="${len*0.44}" fill="none" stroke="#CFD8DC" stroke-width="2"/></g>`;
}

function dropShape(cx, tipY, w, h){
  const cyTop = (tipY - h) + w;
  const shoulderY = cyTop;
  const dropH = tipY - shoulderY;
  return `M ${cx-w},${shoulderY} A ${w},${w} 0 0 0 ${cx+w},${shoulderY} C ${cx+w},${shoulderY + dropH*0.5} ${cx+w*0.5},${shoulderY + dropH*0.82} ${cx},${tipY} C ${cx-w*0.5},${shoulderY + dropH*0.82} ${cx-w},${shoulderY + dropH*0.5} ${cx-w},${shoulderY} Z`;
}

function sieve(cx, cy, rx){
  let mesh = '';
  for(let x = -rx+8; x <= rx-8; x += 12) mesh += `<line x1="${cx+x}" y1="${cy-4}" x2="${cx+x}" y2="${cy+14}" stroke="#90A4AE" stroke-width="1" opacity=".7"/>`;
  for(let y = 0; y <= 14; y += 5) mesh += `<line x1="${cx-rx+6}" y1="${cy+y}" x2="${cx+rx-6}" y2="${cy+y}" stroke="#90A4AE" stroke-width="1" opacity=".7"/>`;

}

function chocoBar(x,y,w,h,c){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${c||'#4E342E'}"/><line x1="${x+w/3}" y1="${y+2}" x2="${x+w/3}" y2="${y+h-2}" stroke="#2B1B14" stroke-width="1.2" opacity=".5"/><line x1="${x+w*2/3}" y1="${y+2}" x2="${x+w*2/3}" y2="${y+h-2}" stroke="#2B1B14" stroke-width="1.2" opacity=".5"/><line x1="${x+2}" y1="${y+h/2}" x2="${x+w-2}" y2="${y+h/2}" stroke="#2B1B14" stroke-width="1.2" opacity=".5"/>`;

/* 智能放置标签：靠近顶部的原料标签放在其上方，其他放左右两侧；同时显示中英文 */
function addSceneTag(cx, cy, zh, side){
  const svg = sceneEl.querySelector('svg');
  if(!svg) return;
  const en = ZH_EN[zh] || '';

  let tx, ty, useVertical = false;

  // 顶部区域的原料：标签放在其上方
  if(cy < 130){
    tx = cx;
    ty = cy - 58;
    useVertical = true;
  } else {
    ty = cy;
    if(side === 'l'){
      tx = cx - 88;
      if(tx < 80) tx = cx + 88;      // 太靠左就翻到右边
    } else {
      tx = cx + 88;
      if(tx > 820) tx = cx - 88;     // 太靠右就翻到左边
    }
  }

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('opacity', '0');
  g.style.transition = 'opacity .3s';

  let dashLine = '';
  if(useVertical){
    dashLine = `<line x1="${cx}" y1="${ty + 15}" x2="${cx}" y2="${cy - 18}" stroke="#F9A825" stroke-width="2.5" stroke-dasharray="5 3"/>`;
  } else {
    const tx2 = (tx > cx) ? cx + 32 : cx - 32;
    dashLine = `<line x1="${tx2}" y1="${cy}" x2="${cx}" y2="${cy}" stroke="#F9A825" stroke-width="2.5" stroke-dasharray="5 3"/>`;
  }

  g.innerHTML = `
    ${dashLine}
    <text x="${tx}" y="${ty - 2}" text-anchor="middle" font-size="14" font-weight="800" fill="#3E2723">${zh}</text>
    <text x="${tx}" y="${ty + 14}" text-anchor="middle" font-size="11" font-weight="600" fill="#8D6E63" font-style="italic">${en}</text>
  `;
  svg.appendChild(g);
  requestAnimationFrame(()=>g.setAttribute('opacity','1'));
}

/* ==================== 导航 ==================== */
let current = 1;
const TOTAL = STEPS.length;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderTrack(){
  const t=document.getElementById('strack');let h='';
  for(let i=1;i<=TOTAL;i++){ let c='tdot'; if(i<current)c+=' done'; else if(i===current)c+=' cur'; h+=`<div class="${c}"></div>`; }
  t.innerHTML=h;
}
function renderHeader(){
  const s=STEPS[current-1];
  document.querySelector('#sname .num').textContent=`STEP ${current} / ${TOTAL}`;
  document.querySelector('#sname .en').textContent=s.nameEn;
  document.querySelector('#sname .zh').textContent=s.name;
  document.querySelector('#sname .stage').textContent=s.stage+' · '+s.stageEn;
  document.getElementById('rstep').innerHTML=`<div class="r-en">${s.recipeEn||''}</div><div class="r-zh">${s.recipe||''}</div>`;
}

function goTo(n){
  if(n<1||n>TOTAL)return;
  clearT();
  coAreaEl.innerHTML='';
  current=n;
  if(n>=3) ingReady=true;

  const step=STEPS[current-1];
  useIng(step.uses);
  renderRecipe(Object.keys(step.uses||{}));
  renderUseList(step.uses);
  renderTrack();
  renderHeader();
  document.body.classList.toggle('title-mode', !!step.isTitle);

  step.build();

  sceneEl.querySelectorAll('[data-fly]').forEach(el => {
    el.style.transition = 'none';
    el.style.opacity = '0';
  });

  rawLater(runFlyIns, 100);

  prevBtn.disabled = current===1;
  nextBtn.disabled = current===TOTAL;
  nextBtn.textContent = current===TOTAL ? '已完成 ✓' : '下一步 →';
}

prevBtn.addEventListener('click',()=>goTo(current-1));
nextBtn.addEventListener('click',()=>goTo(current+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')goTo(current+1);
  if(e.key==='ArrowLeft')goTo(current-1);
});

renderRecipe();
renderUseList({});
goTo(1);
</script>
